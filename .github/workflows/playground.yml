# Builds the playground and publishes it to GitHub Pages.
#
# The playground consumes the package through the workspace, so the library
# has to be built first — its `dist` is gitignored and does not exist in a
# fresh checkout.
name: Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time, and let a newer push supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build the package
        run: bun run --filter vuetiwatch build

      - name: Build the playground
        # A project site lives at /<repo>/, so the assets need that prefix.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run --filter vuetiwatch-playground build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
